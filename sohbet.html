<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sohbet - Umbreon Anarchi</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --gold: #f5c542; --dark: #0b0d14; --panel: #151a2a; --line: rgba(245,197,66,.18); }
  body { margin: 0; font-family: system-ui, sans-serif; color: #fff; background: var(--dark); height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 30px; background: rgba(11,13,20,.9); border-bottom: 1px solid var(--line);
  }
  .topbar a { color: var(--gold); text-decoration: none; font-weight: 700; }
  h1 { font-size: 1.3rem; color: var(--gold); margin: 0; }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg img { width: 36px; height: 36px; border-radius: 6px; image-rendering: pixelated; flex-shrink: 0; }
  .msg-body { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; max-width: 100%; }
  .msg-user { color: var(--gold); font-weight: 700; font-size: 14px; }
  .msg-time { color: #6b7285; font-size: 12px; margin-left: 8px; font-weight: 400; }
  .msg-text { color: #e3e6ee; margin-top: 4px; word-break: break-word; line-height: 1.5; }

  form#chatForm {
    display: flex; gap: 10px; padding: 16px 20px; max-width: 800px; width: 100%; margin: 0 auto;
    border-top: 1px solid var(--line);
  }
  #chatInput {
    flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333a50;
    background: var(--panel); color: #fff; font-size: 15px;
  }
  button {
    cursor: pointer; border: 0; border-radius: 8px; padding: 12px 20px;
    font-weight: 700; color: #111; background: var(--gold);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .notice { text-align: center; color: #9aa1b0; padding: 40px 20px; }
  .notice a { color: var(--gold); }
  .hint { color: #6b7285; font-size: 12px; text-align: center; padding-bottom: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html">← Ana Sayfa</a>
  <h1>Topluluk Sohbeti</h1>
  <span id="whoami" style="color:#9aa1b0;font-size:14px"></span>
</header>

<div id="messages"></div>

<form id="chatForm" hidden>
  <input id="chatInput" maxlength="200" placeholder="Bir mesaj yaz..." autocomplete="off" required>
  <button type="submit" id="sendBtn">Gönder</button>
</form>
<p class="hint" id="hint" hidden>Mesajlar en fazla 200 karakter olabilir.</p>

<div class="notice" id="loginNotice" hidden>
  Sohbete katılmak için önce <a href="index.html">ana sayfadan</a> giriş yap.
</div>

<script>
  /* ===== AYARLAR ===== */
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBMoXFanC2gU2ZnuVr2CkLnmGMVWRzqzJs",
    authDomain: "umbreon-chat.firebaseapp.com",
    databaseURL: "https://umbreon-chat-default-rtdb.firebaseio.com",
    projectId: "umbreon-chat",
    appId: "1:983558497766:web:113e2419300a3730b2e227"
  };

  const MAX_MESSAGES = 50; // Ekranda gösterilen son mesaj sayısı

  /* ===== OTURUM ===== */
  const saved = JSON.parse(localStorage.getItem('ua_db')) || {};
  const me = saved.session || null;

  if (!me) {
    document.getElementById('loginNotice').hidden = false;
  } else {
    document.getElementById('chatForm').hidden = false;
    document.getElementById('hint').hidden = false;
    document.getElementById('whoami').textContent = 'Giriş: ' + me;
    startChat();
  }

  /* ===== SOHBET ===== */
  function startChat() {
    firebase.initializeApp(FIREBASE_CONFIG);
    const chatRef = firebase.database().ref('chat').limitToLast(MAX_MESSAGES);

    chatRef.on('child_added', snap => addMessage(snap.val()));

    document.getElementById('chatForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;

      firebase.database().ref('chat').push({
        user: me,
        text: text,
        time: Date.now()
      }).then(() => {
        input.value = '';
      }).catch(() => {
        alert('Mesaj gönderilemedi. Bağlantını kontrol et.');
      }).finally(() => {
        btn.disabled = false;
        input.focus();
      });
    });
  }

  function addMessage(m) {
    if (!m) return;
    const box = document.getElementById('messages');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

    const row = document.createElement('div');
    row.className = 'msg';

    const img = document.createElement('img');
    img.src = 'https://mc-heads.net/avatar/' + encodeURIComponent(m.user) + '/36';
    img.alt = '';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const head = document.createElement('div');
    head.className = 'msg-user';
    head.textContent = m.user;

    const time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = new Date(m.time).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    head.appendChild(time);

    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = m.text;

    body.append(head, text);
    row.append(img, body);
    box.appendChild(row);

    if (atBottom) box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
