<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAXY SMP</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --accent: #c084fc;
    --dark: #12081f;
    --panel: #1d1030;
    --line: rgba(192, 132, 252, .25);
  }
  body { margin: 0; font-family: system-ui, sans-serif; color: #fff; background: var(--dark); }

  /* Sabit üst panel */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    padding: 12px 30px; gap: 10px;
    background: rgba(18, 8, 31, .92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; color: var(--accent); }
  .logo img { height: 36px; width: 36px; object-fit: contain; }
  nav a { color: #e5d4f5; text-decoration: none; margin: 0 14px; font-weight: 600; }
  nav a:hover { color: var(--accent); }
  .actions { display: flex; gap: 8px; align-items: center; }

  button {
    cursor: pointer; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 700; color: #fff; background: #9333ea;
  }
  button:hover { filter: brightness(1.12); }
  button.ghost { background: rgba(255,255,255,.08); }
  button.ghost:hover { background: rgba(255,255,255,.16); }

  .head-link { display: inline-flex; border-radius: 8px; overflow: hidden; border: 2px solid var(--accent); }
  .head-link img { width: 36px; height: 36px; display: block; image-rendering: pixelated; }
  .welcome { font-size: 14px; color: #d8b4fe; }

  /* Ana bölüm */
  .hero {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 30px; flex-wrap: wrap; padding: 90px 60px;
    background:
      radial-gradient(circle at 80% 40%, rgba(192,132,252,.25), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(147,51,234,.35), transparent 50%),
      var(--dark);
  }
  .hero-text { max-width: 560px; }
  .hero h1 {
    font-size: 4rem; margin: 0 0 10px; letter-spacing: 2px;
    color: var(--accent); text-shadow: 0 0 25px rgba(192,132,252,.45);
  }
  .hero p { color: #d6c3e8; font-size: 1.1rem; margin: 0 0 24px; }
  .server-ip {
    display: inline-block; margin-top: 6px; padding: 10px 18px;
    border: 1px solid var(--accent); border-radius: 8px;
    color: var(--accent); font-weight: 700; letter-spacing: 1px;
  }
  .hero-img {
    width: min(380px, 80vw);
    filter: drop-shadow(0 0 30px rgba(192,132,252,.4));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-12px); } }

  section.block { padding: 70px 30px; }
  .block h2 { text-align: center; font-size: 2rem; margin: 0 0 30px; color: var(--accent); }

  /* İstatistikler */
  .stats-grid {
    display: grid; gap: 20px; max-width: 900px; margin: auto;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px; text-align: center;
  }
  .stat-label { color: #b9a3cf; font-size: 14px; }
  .stat-value { font-size: 2rem; font-weight: 800; color: var(--accent); margin-top: 8px; }
  .updated { text-align: center; color: #7d6a94; font-size: 13px; margin-top: 18px; }

  /* Haberler */
  .news { max-width: 700px; margin: auto; }
  .news-item {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 22px; margin-bottom: 16px;
  }
  .news-item img { width: 100%; border-radius: 10px; margin-bottom: 12px; display: block; }
  .news-item .date { font-size: 12px; color: var(--accent); font-weight: 700; }
  .news-item h3 { margin: 6px 0 8px; }
  .news-item p { margin: 0; color: #d6c3e8; line-height: 1.6; }

  footer {
    text-align: center; padding: 24px; color: #7d6a94; font-size: 13px;
    border-top: 1px solid var(--line);
  }

  /* Giriş modalı */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.65); display: none;
    align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .box {
    position: relative; width: min(380px, 92%); max-height: 85vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line);
    padding: 26px; border-radius: 14px;
  }
  .box input {
    width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px;
    border: 1px solid #4a3566; background: var(--dark); color: #fff;
  }
  .box form button { width: 100%; }
  .close { position: absolute; top: 8px; right: 12px; background: none; color: #fff; font-size: 24px; padding: 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button:not(.active) { background: rgba(255,255,255,.08); }
  .msg { color: #f87171; min-height: 20px; font-size: 14px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <img src="umbreon.jfif" alt="">
    GALAXY SMP
  </div>
  <nav>
    <a href="#home">Ana Sayfa</a>
    <a href="#stats">İstatistikler</a>
    <a href="#news">Haberler</a>
    <a href="sohbet.html">Sohbet</a>
    <a href="pazar.html">Pazar</a>
  </nav>
  <div class="actions" id="authArea"></div>
</header>

<section class="hero" id="home">
  <div class="hero-text">
    <h1>GALAXY SMP</h1>
    <p>Yıldızların altında macera seni bekliyor. Sunucumuza hoş geldin!</p>
    <div class="server-ip" id="serverIp"></div>
  </div>
  <img class="hero-img" src="umbreon.jfif" alt="">
</section>

<section class="block" id="stats">
  <h2>Sunucu İstatistikleri</h2>
  <div class="stats-grid">
    <div class="stat"><div class="stat-label">Durum</div><div class="stat-value" id="statStatus">-</div></div>
    <div class="stat"><div class="stat-label">Online Oyuncu</div><div class="stat-value" id="statOnline">-</div></div>
    <div class="stat"><div class="stat-label">Maksimum Oyuncu</div><div class="stat-value" id="statMax">-</div></div>
  </div>
  <p class="updated" id="statUpdated"></p>
</section>

<section class="block" id="news">
  <h2>Haberler</h2>
  <div class="news" id="newsList"></div>
</section>

<footer>© GALAXY SMP</footer>

<!-- Giriş / Kayıt modalı -->
<div class="modal" id="authModal">
  <div class="box">
    <button class="close" onclick="closeModal('authModal')">×</button>
    <div class="tabs">
      <button id="tabLogin" onclick="switchTab('login')">Giriş Yap</button>
      <button id="tabRegister" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <form id="loginForm" onsubmit="login(event)">
      <input id="loginUser" placeholder="Minecraft kullanıcı adı" required>
      <input id="loginPass" type="password" placeholder="Şifre" required>
      <button type="submit">Giriş Yap</button>
    </form>

    <form id="registerForm" hidden onsubmit="register(event)">
      <input id="regUser" placeholder="Minecraft kullanıcı adı (3-16 harf/rakam/_)" required>
      <input id="regPass" type="password" placeholder="Şifre (en az 6 karakter)" required>
      <button type="submit">Kayıt Ol</button>
    </form>

    <p class="msg" id="authMsg"></p>
  </div>
</div>

<script>
  /* ===== AYARLAR ===== */
  const SERVER_ADDRESS = 'galaxysmp34.mangoohost.live';

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyBMoXFanC2gU2ZnuVr2CkLnmGMVWRzqzJs",
    authDomain: "umbreon-chat.firebaseapp.com",
    databaseURL: "https://umbreon-chat-default-rtdb.firebaseio.com",
    projectId: "umbreon-chat",
    appId: "1:983558497766:web:113e2419300a3730b2e227"
  };

  /* ===== HABERLER (en fazla 5) ===== */
  const news = [
    { date: '03.11.2026', title: 'Açılış Tarihi', text: '13 Kasım Cuma Günü Açılıyoruz', image: 'haber1.png' },
    { date: '03.11.2026', title: 'Galaxy SMP Nedir?', text: 'Galaxy Smp , Donut Smp benzeri ama base patlatma olmayan bir versiyonu.Eğlenmek İsteyen Herkese Kapımız Açık!', image: 'haber2.jfif' }
  ].slice(0, 5);

  /* ===== YARDIMCILAR ===== */
  firebase.initializeApp(FIREBASE_CONFIG);
  const dbRef = firebase.database();
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Giriş durumu tarayıcıda saklanır: her açılışta hatırlanır
  function getSession() { return JSON.parse(localStorage.getItem('galaxy_session')) || null; }
  function setSession(name) { localStorage.setItem('galaxy_session', JSON.stringify(name)); }
  function clearSession() { localStorage.removeItem('galaxy_session'); }

  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) { $(id).classList.remove('open'); }
  document.querySelectorAll('.modal').forEach(m =>
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); })
  );

  /* ===== KAYIT / GİRİŞ (hesaplar Firebase'de) ===== */
  function openAuth(tab) { switchTab(tab); openModal('authModal'); }
  function switchTab(tab) {
    $('loginForm').hidden = tab !== 'login';
    $('registerForm').hidden = tab !== 'register';
    $('tabLogin').classList.toggle('active', tab === 'login');
    $('tabRegister').classList.toggle('active', tab === 'register');
    $('authMsg').textContent = '';
  }

  function validName(u) { return /^[A-Za-z0-9_]{3,16}$/.test(u); }

  async function register(e) {
    e.preventDefault();
    const u = $('regUser').value.trim(), p = $('regPass').value;
    $('authMsg').textContent = '';
    if (!validName(u)) return $('authMsg').textContent = 'Kullanıcı adı 3-16 karakter, sadece harf, rakam ve _ olmalı.';
    if (p.length < 6) return $('authMsg').textContent = 'Şifre en az 6 karakter olmalı.';

    const ref = dbRef.ref('users/' + u.toLowerCase());
    const snap = await ref.get();
    if (snap.exists()) return $('authMsg').textContent = 'Bu kullanıcı adı zaten kayıtlı.';

    await ref.set({ username: u, password: p, created: Date.now() });
    setSession(u);
    e.target.reset();
    closeModal('authModal');
    updateUI();
  }

  async function login(e) {
    e.preventDefault();
    const u = $('loginUser').value.trim(), p = $('loginPass').value;
    $('authMsg').textContent = '';

    const snap = await dbRef.ref('users/' + u.toLowerCase()).get();
    if (!snap.exists() || snap.val().password !== p)
      return $('authMsg').textContent = 'Kullanıcı adı veya şifre hatalı.';

    setSession(snap.val().username);
    e.target.reset();
    closeModal('authModal');
    updateUI();
  }

  function logout() { clearSession(); updateUI(); }

  function headUrl(name) {
    return 'https://mc-heads.net/avatar/' + encodeURIComponent(name) + '/64';
  }

  function updateUI() {
    const me = getSession();
    $('authArea').innerHTML = me
      ? `<span class="welcome">Giriş yapıldı: <b>${esc(me)}</b></span>
         <a class="head-link" href="profil.html" title="Profilim">
           <img src="${headUrl(me)}" alt="${esc(me)}">
         </a>
         <button class="ghost" onclick="logout()">Çıkış</button>`
      : `<button class="ghost" onclick="openAuth('login')">Giriş Yap</button>
         <button onclick="openAuth('register')">Kayıt Ol</button>`;
  }

  /* ===== HABERLER ===== */
  function renderNews() {
    $('newsList').innerHTML = news.map(n => `
      <div class="news-item">
        <img src="${esc(n.image)}" alt="" onerror="this.remove()">
        <div class="date">${esc(n.date)}</div>
        <h3>${esc(n.title)}</h3>
        <p>${esc(n.text)}</p>
      </div>`).join('');
  }

  /* ===== OYUNCU İSTATİSTİKLERİ (5 dakikada bir) ===== */
  async function loadStats() {
    try {
      const r = await fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(SERVER_ADDRESS));
      const d = await r.json();
      $('statStatus').textContent = d.online ? 'Açık' : 'Kapalı';
      $('statOnline').textContent = d.online ? (d.players?.online ?? 0) : '-';
      $('statMax').textContent = d.online ? (d.players?.max ?? '-') : '-';
    } catch {
      $('statStatus').textContent = 'Hata';
      $('statOnline').textContent = '-';
      $('statMax').textContent = '-';
    }
    $('statUpdated').textContent = 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
  }

  $('serverIp').textContent = SERVER_ADDRESS;
  renderNews();
  updateUI();
  loadStats();
  setInterval(loadStats, 5 * 60 * 1000);
</script>
</body>
</html>
