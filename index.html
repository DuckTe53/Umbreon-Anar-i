<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umbreon Anarchi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :root {
    --gold: #f5c542;
    --dark: #0b0d14;
    --panel: #151a2a;
    --line: rgba(245, 197, 66, .18);
  }
  body { margin: 0; font-family: system-ui, sans-serif; color: #fff; background: var(--dark); }

  /* Sabit üst panel */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    padding: 12px 30px; gap: 10px;
    background: rgba(11, 13, 20, .9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; color: var(--gold); }
  .logo img { height: 36px; width: 36px; object-fit: contain; }
  nav a { color: #cfd3dc; text-decoration: none; margin: 0 14px; font-weight: 600; }
  nav a:hover { color: var(--gold); }
  .actions { display: flex; gap: 8px; align-items: center; }

  button {
    cursor: pointer; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 700; color: #111; background: var(--gold);
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: rgba(255,255,255,.08); color: #fff; }
  button.ghost:hover { background: rgba(255,255,255,.16); }

  /* Ana bölüm */
  .hero {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 30px; flex-wrap: wrap; padding: 90px 60px;
    background:
      radial-gradient(circle at 80% 40%, rgba(245,197,66,.18), transparent 45%),
      radial-gradient(circle at 10% 90%, rgba(60,80,160,.35), transparent 50%),
      var(--dark);
  }
  .hero-text { max-width: 560px; }
  .hero h1 {
    font-size: 4rem; margin: 0 0 10px; letter-spacing: 2px;
    color: var(--gold); text-shadow: 0 0 25px rgba(245,197,66,.35);
  }
  .hero p { color: #b9bfcc; font-size: 1.1rem; margin: 0 0 24px; }
  .hero-img {
    width: min(380px, 80vw);
    filter: drop-shadow(0 0 30px rgba(245,197,66,.35));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-12px); } }

  section.block { padding: 70px 30px; }
  .block h2 { text-align: center; font-size: 2rem; margin: 0 0 30px; color: var(--gold); }

  /* İstatistikler */
  .stats-grid {
    display: grid; gap: 20px; max-width: 900px; margin: auto;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 22px; text-align: center;
  }
  .stat-label { color: #9aa1b0; font-size: 14px; }
  .stat-value { font-size: 2rem; font-weight: 800; color: var(--gold); margin-top: 8px; }
  .updated { text-align: center; color: #6b7285; font-size: 13px; margin-top: 18px; }

  /* Haberler */
  .news { max-width: 700px; margin: auto; }
  .news-item {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 22px; margin-bottom: 16px;
  }
  .news-item img { width: 100%; border-radius: 10px; margin-bottom: 12px; display: block; }
  .news-item .date { font-size: 12px; color: var(--gold); font-weight: 700; }
  .news-item h3 { margin: 6px 0 8px; }
  .news-item p { margin: 0; color: #c3c8d3; line-height: 1.6; }

  footer {
    text-align: center; padding: 24px; color: #6b7285; font-size: 13px;
    border-top: 1px solid var(--line);
  }

  /* Giriş modalı */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.65); display: none;
    align-items: center; justify-content: center;
  }
  .modal.open { display: flex; }
  .box {
    position: relative; width: min(380px, 92%); max-height: 85vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line);
    padding: 26px; border-radius: 14px;
  }
  .box input {
    width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px;
    border: 1px solid #333a50; background: var(--dark); color: #fff;
  }
  .box form button { width: 100%; }
  .close { position: absolute; top: 8px; right: 12px; background: none; color: #fff; font-size: 24px; padding: 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button:not(.active) { background: rgba(255,255,255,.08); color: #fff; }
  .msg { color: #f87171; min-height: 20px; font-size: 14px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <img src="umbreon.png" alt="">
    UMBREON ANARCHI
  </div>
  <nav>
    <a href="#home">Ana Sayfa</a>
    <a href="#stats">İstatistikler</a>
    <a href="#news">Haberler</a>
  </nav>
  <div class="actions" id="authArea"></div>
</header>

<section class="hero" id="home">
  <div class="hero-text">
    <h1>UMBREON ANARCHI</h1>
    <p>Karanlığın içinde parlayan kalite. Sunucumuza hoş geldin!</p>
  </div>
  <img class="hero-img" src="umbreon.png" alt="Umbreon">
</section>

<section class="block" id="stats">
  <h2>Sunucu İstatistikleri</h2>
  <div class="stats-grid">
    <div class="stat"><div class="stat-label">Durum</div><div class="stat-value" id="statStatus">-</div></div>
    <div class="stat"><div class="stat-label">Online Oyuncu</div><div class="stat-value" id="statOnline">-</div></div>
    <div class="stat"><div class="stat-label">Maksimum Oyuncu</div><div class="stat-value" id="statMax">-</div></div>
  </div>
  <p class="updated" id="statUpdated"></p>
</section>

<section class="block" id="news">
  <h2>Haberler</h2>
  <div class="news" id="newsList"></div>
</section>

<footer>© Umbreon Anarchi</footer>

<!-- Giriş / Kayıt modalı -->
<div class="modal" id="authModal">
  <div class="box">
    <button class="close" onclick="closeModal('authModal')">×</button>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">Giriş Yap</button>
      <button id="tabRegister" onclick="switchTab('register')">Kayıt Ol</button>
    </div>

    <form id="loginForm" onsubmit="login(event)">
      <input id="loginUser" placeholder="Kullanıcı adı" required>
      <input id="loginPass" type="password" placeholder="Şifre" required>
      <button type="submit">Giriş Yap</button>
    </form>

    <form id="registerForm" hidden onsubmit="register(event)">
      <input id="regUser" placeholder="Kullanıcı adı" required>
      <input id="regMail" type="email" placeholder="E-posta" required>
      <input id="regPass" type="password" placeholder="Şifre (en az 6 karakter)" required>
      <button type="submit">Kayıt Ol</button>
    </form>

    <p class="msg" id="authMsg"></p>
  </div>
</div>

<script>
  /* ===== AYARLAR ===== */
  // Mangohost sunucunun adresi (örn: umbreon.mangohost.net:25565)
  const SERVER_ADDRESS = 'SUNUCU_ADRESI';

  /* ===== HABERLER (en fazla 5 haber) =====
     Görseller: haber1.png, haber2.png ... olarak klasöre koy.
     Görsel yoksa haber yine görünür, sadece resim gizlenir. */
  const news = [
    { date: '03.11.2026', title: 'Sunucu açıldı!', text: 'Hoş geldin, kayıt olup sunucuya katılabilirsin.', image: 'haber1.png' },
    { date: '01.11.2026', title: 'Yeni etkinlik', text: 'Bu hafta sonu özel turnuva düzenlenecek.', image: 'haber2.png' }
  ].slice(0, 5);

  /* ===== YARDIMCILAR ===== */
  const $ = id => document.getElementById(id);
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  let db = JSON.parse(localStorage.getItem('ua_db')) || { users: [], session: null };
  function save() { localStorage.setItem('ua_db', JSON.stringify(db)); }

  function openModal(id) { $(id).classList.add('open'); }
  function closeModal(id) { $(id).classList.remove('open'); }
  document.querySelectorAll('.modal').forEach(m =>
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); })
  );

  /* ===== KAYIT / GİRİŞ ===== */
  function openAuth(tab) { switchTab(tab); openModal('authModal'); }
  function switchTab(tab) {
    $('loginForm').hidden = tab !== 'login';
    $('registerForm').hidden = tab !== 'register';
    $('tabLogin').classList.toggle('active', tab === 'login');
    $('tabRegister').classList.toggle('active', tab === 'register');
    $('authMsg').textContent = '';
  }

  function register(e) {
    e.preventDefault();
    const u = $('regUser').value.trim(), m = $('regMail').value.trim(), p = $('regPass').value;
    if (p.length < 6) return $('authMsg').textContent = 'Şifre en az 6 karakter olmalı.';
    if (db.users.some(x => x.username.toLowerCase() === u.toLowerCase()))
      return $('authMsg').textContent = 'Bu kullanıcı adı zaten alınmış.';
    db.users.push({ username: u, email: m, password: p });
    db.session = u;
    save();
    e.target.reset();
    closeModal('authModal');
    updateUI();
  }

  function login(e) {
    e.preventDefault();
    const user = db.users.find(x => x.username === $('loginUser').value.trim() && x.password === $('loginPass').value);
    if (!user) return $('authMsg').textContent = 'Kullanıcı adı veya şifre hatalı.';
    db.session = user.username;
    save();
    e.target.reset();
    closeModal('authModal');
    updateUI();
  }

  function logout() { db.session = null; save(); updateUI(); }

  function updateUI() {
    $('authArea').innerHTML = db.session
      ? `<button class="ghost" disabled>👤 ${esc(db.session)}</button>
         <button class="ghost" onclick="logout()">Çıkış</button>`
      : `<button class="ghost" onclick="openAuth('login')">Giriş Yap</button>
         <button onclick="openAuth('register')">Kayıt Ol</button>`;
  }

  /* ===== HABERLER ===== */
  function renderNews() {
    $('newsList').innerHTML = news.map(n => `
      <div class="news-item">
        <img src="${esc(n.image)}" alt="" onerror="this.remove()">
        <div class="date">${esc(n.date)}</div>
        <h3>${esc(n.title)}</h3>
        <p>${esc(n.text)}</p>
      </div>`).join('');
  }

  /* ===== OYUNCU İSTATİSTİKLERİ (5 dakikada bir yenilenir) ===== */
  async function loadStats() {
    try {
      const r = await fetch('https://api.mcsrvstat.us/3/' + encodeURIComponent(SERVER_ADDRESS));
      const d = await r.json();
      $('statStatus').textContent = d.online ? 'Açık' : 'Kapalı';
      $('statOnline').textContent = d.online ? (d.players?.online ?? 0) : '-';
      $('statMax').textContent = d.online ? (d.players?.max ?? '-') : '-';
    } catch {
      $('statStatus').textContent = 'Hata';
      $('statOnline').textContent = '-';
      $('statMax').textContent = '-';
    }
    $('statUpdated').textContent = 'Son güncelleme: ' + new Date().toLocaleTimeString('tr-TR');
  }

  renderNews();
  updateUI();
  loadStats();
  setInterval(loadStats, 5 * 60 * 1000);
</script>
</body>
</html>
